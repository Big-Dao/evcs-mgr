plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

group = 'com.bigdao.evcs'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':evcs-common')
    implementation project(':evcs-protocol')  // 需要ProtocolEventListener接口
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    
    // HTTP Client
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    
    // Database
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    
    // API Documentation
    implementation "com.github.xiaoymin:knife4j-openapi3-spring-boot-starter:${knife4jVersion}"
    
    // Test dependencies for integration tests
    testImplementation project(':evcs-station')
    testImplementation project(':evcs-order')
    testImplementation project(':evcs-payment')
    testImplementation 'com.alipay.sdk:alipay-sdk-java:4.35.79.ALL'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "com.h2database:h2:${h2Version}"  // 统一H2版本
    testImplementation('it.ozimov:embedded-redis:0.7.3') { // 嵌入式 Redis for testing
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    
    // Include test utilities from evcs-common using testFixtures
    testImplementation testFixtures(project(':evcs-common'))
}

tasks.named('test') {
    useJUnitPlatform()
}
