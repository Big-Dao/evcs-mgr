server:
  port: 8080

spring:
  application:
    name: evcs-gateway
  main:
    web-application-type: reactive
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  cloud:
    gateway:
      # 路由配置通过Config Server管理
      # 本地不定义 routes，确保由 Config Server 下发
      routes: 
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# 网关安全配置
evcs:
  gateway:
    security:
      context-headers:
        # 启用可信上下文头注入（默认 true）；从 JWT 派生 tenant/user 头注入下游
        enabled: true
        # 剥离客户端伪造的 X-Tenant-Id/X-User-Id/X-User-Id 头（默认 true，防伪造）
        strip-client-context-headers: true
        # JWT 签名密钥（必填）；生产必须通过 JWT_SECRET 环境变量注入 >= 32 字符随机密钥
        jwt-secret: ${JWT_SECRET}

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.config: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
