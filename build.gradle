plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.12' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'com.palantir.docker' version '0.35.0' apply false
    id 'com.google.cloud.tools.jib' version '3.4.4' apply false
    id 'jacoco' // 代码覆盖率
    // id 'checkstyle' // 代码风格检查
    // id 'pmd' // 代码质量检查
    // id 'com.github.spotbugs' version '6.0.25' apply false // 静态代码分析
}

group = 'com.evcs'
version = '1.0.0'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://repo1.maven.org/maven2' }
    mavenCentral()
}

// Java版本配置
allprojects {
    apply plugin: 'java'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://repo1.maven.org/maven2' }
        mavenCentral()
    }
}

// 子项目通用配置
subprojects {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'
    // Temporarily disabled checkstyle due to configuration issues
    // apply plugin: 'checkstyle'
    // apply plugin: 'pmd'
    // apply plugin: 'com.github.spotbugs'
    // Quality checks re-enabled to verify warning resolution

    group = rootProject.group
    version = rootProject.version
    
    // 依赖版本管理
    ext {
        springCloudVersion = '2023.0.6'  // 升级：Spring Boot 3.2.x兼容，修复Eureka和Gateway的bug
        postgresqlVersion = '42.7.5'  // 升级：连接池泄露修复、性能优化、安全补丁
        redisVersion = '5.0.1'
        jwtVersion = '3.19.2'  // 稳定版本 - 改为3.19.2解决Maven仓库找不到4.4.0的问题
        mybatisPlusVersion = '3.5.8'  // 保持：3.5.9尚未发布或不兼容
    mybatisSpringVersion = '3.0.3'  // Spring Boot 3.2.x兼容版本
        fastjson2Version = '2.0.53'  // 升级：修复反序列化安全漏洞 ⚠️ CRITICAL
        hutoolVersion = '5.8.34'  // 升级：修复安全漏洞（文件操作、加密等）⚠️ HIGH
        knife4jVersion = '4.5.0'
        logstashLogbackVersion = '7.4'
        resilience4jVersion = '2.2.0'  // Spring Boot 3 compatible (available in Maven repos)
        h2Version = '2.3.232'  // 统一H2数据库版本（最新稳定版），修复PostgreSQL兼容性问题
    }
    
    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
        dependencies {
            dependency "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
        }
    }
    
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'

        // Required by Gradle's test execution; make it explicit to avoid Gradle 8.x deprecation
        // warning about automatic loading of test framework implementation dependencies.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // Keep jsr305 annotations on the compile classpath to avoid javac warnings
        // like "unknown enum constant When.MAYBE" from transitive dependencies.
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        
        // Lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }
    
    tasks.named('test') {
        useJUnitPlatform()

        // 测试失败后继续执行其他测试
        ignoreFailures = false

        jacoco {
            excludes = ['net/sf/jsqlparser/**']
        }

        // 显示测试输出
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
            showStandardStreams = false
        }
        
        // 生成测试报告
        finalizedBy jacocoTestReport
    }
    
    // JaCoCo测试覆盖率报告配置
    jacocoTestReport {
        dependsOn test
        
        reports {
            xml.required = true
            html.required = true
            html.outputLocation = file("${buildDir}/reports/jacoco")
        }
        
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/entity/**',
                    '**/dto/**',
                    '**/vo/**',
                    '**/*Application.class'
                ])
            }))
        }
    }
    
    // JaCoCo覆盖率验证
    def coverageGateEnabled = ((findProperty('evcsCoverageGate')
            ?: System.getenv('EVCS_COVERAGE_GATE')
            ?: 'false').toString().toBoolean())

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                enabled = coverageGateEnabled
                limit {
                    minimum = 0.60 // 60%覆盖率
                }
            }
        }
    }

    // Checkstyle配置
    // checkstyle {
    //     toolVersion = '10.12.4'
    //     configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    //     ignoreFailures = false
    //     maxWarnings = 0
    //     maxErrors = 0
    // }

    // SpotBugs配置
    // spotbugs {
    //     toolVersion = '4.8.6'
    //     ignoreFailures = true // Allow build to continue with minor warnings
    //     showStackTraces = true
    //     showProgress = true
    //     excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
    // }

    // 编译配置
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.register('forbidThreadingPrimitives') {
        group = 'verification'
        description = 'Fail build if production code uses raw Thread/Executors APIs (must use context-propagating executors or Spring scheduling).'

        doLast {
            def gateMode = (System.getProperty('evcs.gate.threading')
                    ?: System.getenv('EVCS_GATE_THREADING')
                    ?: 'fail').toString().toLowerCase()
            def allowedModes = ['off', 'warn', 'fail'] as Set
            if (!allowedModes.contains(gateMode)) {
                throw new GradleException(
                        "Invalid gate mode for evcs.gate.threading: '${gateMode}'. Allowed: off|warn|fail"
                )
            }
            if (gateMode == 'off') {
                return
            }

            def srcDir = file('src/main/java')
            if (!srcDir.exists()) {
                return
            }

            def stripJavaCommentsAndStrings = { String input ->
                if (input == null || input.isEmpty()) {
                    return input
                }

                def out = new StringBuilder(input.length())
                boolean inLineComment = false
                boolean inBlockComment = false
                boolean inString = false
                boolean inChar = false
                boolean escaped = false

                for (int i = 0; i < input.length(); i++) {
                    char c = input.charAt(i)
                    char n = (i + 1) < input.length() ? input.charAt(i + 1) : (char) 0

                    if (inLineComment) {
                        if (c == '\n') {
                            inLineComment = false
                            out.append(c)
                        } else {
                            out.append(' ')
                        }
                        continue
                    }

                    if (inBlockComment) {
                        if (c == '*' && n == '/') {
                            inBlockComment = false
                            out.append(' ')
                            out.append(' ')
                            i++
                        } else {
                            out.append(c == '\n' ? c : ' ')
                        }
                        continue
                    }

                    if (inString) {
                        if (!escaped && c == '"') {
                            inString = false
                        }
                        escaped = (!escaped && c == '\\')
                        out.append(c == '\n' ? c : ' ')
                        continue
                    }

                    if (inChar) {
                        if (!escaped && c == '\'') {
                            inChar = false
                        }
                        escaped = (!escaped && c == '\\')
                        out.append(c == '\n' ? c : ' ')
                        continue
                    }

                    if (c == '/' && n == '/') {
                        inLineComment = true
                        out.append(' ')
                        out.append(' ')
                        i++
                        continue
                    }

                    if (c == '/' && n == '*') {
                        inBlockComment = true
                        out.append(' ')
                        out.append(' ')
                        i++
                        continue
                    }

                    if (c == '"') {
                        inString = true
                        escaped = false
                        out.append(' ')
                        continue
                    }

                    if (c == '\'') {
                        inChar = true
                        escaped = false
                        out.append(' ')
                        continue
                    }

                    out.append(c)
                }

                return out.toString()
            }

            def rules = [
                    [
                            id     : 'NEW_THREAD',
                            pattern: java.util.regex.Pattern.compile('\\bnew\\s+Thread\\s*\\('),
                            message: 'Do not use new Thread(...) in production code. Use Spring @Async/@Scheduled or a context-propagating executor.'
                    ],
                    [
                            id     : 'EXECUTORS',
                            pattern: java.util.regex.Pattern.compile('\\bExecutors\\s*\\.'),
                            message: 'Do not use java.util.concurrent.Executors in production code. Use a managed/context-propagating executor.'
                    ],
                    [
                            id     : 'IMPORT_EXECUTORS',
                            pattern: java.util.regex.Pattern.compile('^\\s*import\\s+java\\.util\\.concurrent\\.Executors\\s*;', java.util.regex.Pattern.MULTILINE),
                            message: 'Do not import java.util.concurrent.Executors in production code.'
                    ],
                    [
                            id     : 'THREAD_POOL_EXECUTOR',
                            pattern: java.util.regex.Pattern.compile('\\bnew\\s+ThreadPoolExecutor\\s*\\('),
                            message: 'Do not instantiate ThreadPoolExecutor directly in production code. Use a managed/context-propagating executor.'
                    ],
                    [
                            id     : 'SCHEDULED_THREAD_POOL_EXECUTOR',
                            pattern: java.util.regex.Pattern.compile('\\bnew\\s+ScheduledThreadPoolExecutor\\s*\\('),
                            message: 'Do not instantiate ScheduledThreadPoolExecutor directly in production code. Use Spring scheduling (@Scheduled) or a managed scheduler.'
                    ]
            ]

            def violations = []

                def allowMarkerPattern = java.util.regex.Pattern.compile(
                    '(?m)^(?:\\s*//|\\s*/\\*)\\s*EVCS_ALLOW_THREADING_PRIMITIVES\\s*:\\s*\\S.+$'
                )

            srcDir.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                if (!f.name.endsWith('.java')) {
                    return
                }

                def original = f.getText('UTF-8')

                // Escape hatch (must be explicit + justified, near the top of file)
                def head = original
                def firstNewline = 0
                int linesToCheck = 40
                for (int i = 0; i < original.length() && linesToCheck > 0; i++) {
                    if (original.charAt(i) == '\n') {
                        firstNewline = i
                        linesToCheck--
                    }
                }
                if (firstNewline > 0) {
                    head = original.substring(0, firstNewline)
                }

                if (allowMarkerPattern.matcher(head).find()) {
                    return
                }

                def content = stripJavaCommentsAndStrings(original)

                rules.each { rule ->
                    def matcher = rule.pattern.matcher(content)
                    while (matcher.find()) {
                        int start = matcher.start()
                        int line = 1
                        for (int i = 0; i < start && i < content.length(); i++) {
                            if (content.charAt(i) == '\n') {
                                line++
                            }
                        }

                        violations << [file: f, line: line, ruleId: rule.id, message: rule.message]
                    }
                }
            }

            if (!violations.isEmpty()) {
                def details = violations.collect { v ->
                    "- ${v.file}:L${v.line} [${v.ruleId}] ${v.message}"
                }.join('\n')

                def message =
                        "Forbidden threading primitives found in production code.\n" +
                                "Fix: replace with Spring @Async/@Scheduled or a context-propagating managed executor.\n" +
                                "Escape hatch (exceptional only): add a header marker within the first 40 lines: \"// EVCS_ALLOW_THREADING_PRIMITIVES: <reason>\"\n" +
                                details + "\n"

                if (gateMode == 'warn') {
                    logger.warn("[EVCS GATE][threading][WARN]\n" + message)
                    return
                }

                throw new GradleException(message)
            }
        }
    }

    tasks.register('forbidAsyncContextLoss') {
        group = 'verification'
        description = 'Fail build if production code uses async/parallel APIs that default to common pools without context propagation (TenantContext/traceId).'

        doLast {
            def gateMode = (System.getProperty('evcs.gate.async')
                    ?: System.getenv('EVCS_GATE_ASYNC')
                    ?: 'fail').toString().toLowerCase()
            def allowedModes = ['off', 'warn', 'fail'] as Set
            if (!allowedModes.contains(gateMode)) {
                throw new GradleException(
                        "Invalid gate mode for evcs.gate.async: '${gateMode}'. Allowed: off|warn|fail"
                )
            }
            if (gateMode == 'off') {
                return
            }

            def srcDir = file('src/main/java')
            if (!srcDir.exists()) {
                return
            }

            def stripJavaCommentsAndStrings = { String input ->
                if (input == null || input.isEmpty()) {
                    return input
                }

                def out = new StringBuilder(input.length())
                boolean inLineComment = false
                boolean inBlockComment = false
                boolean inString = false
                boolean inChar = false
                boolean escaped = false

                for (int i = 0; i < input.length(); i++) {
                    char c = input.charAt(i)
                    char n = (i + 1) < input.length() ? input.charAt(i + 1) : (char) 0

                    if (inLineComment) {
                        if (c == '\n') {
                            inLineComment = false
                            out.append(c)
                        } else {
                            out.append(' ')
                        }
                        continue
                    }

                    if (inBlockComment) {
                        if (c == '*' && n == '/') {
                            inBlockComment = false
                            out.append(' ')
                            out.append(' ')
                            i++
                        } else {
                            out.append(c == '\n' ? c : ' ')
                        }
                        continue
                    }

                    if (inString) {
                        if (!escaped && c == '"') {
                            inString = false
                        }
                        escaped = (!escaped && c == '\\')
                        out.append(c == '\n' ? c : ' ')
                        continue
                    }

                    if (inChar) {
                        if (!escaped && c == '\'') {
                            inChar = false
                        }
                        escaped = (!escaped && c == '\\')
                        out.append(c == '\n' ? c : ' ')
                        continue
                    }

                    if (c == '/' && n == '/') {
                        inLineComment = true
                        out.append(' ')
                        out.append(' ')
                        i++
                        continue
                    }

                    if (c == '/' && n == '*') {
                        inBlockComment = true
                        out.append(' ')
                        out.append(' ')
                        i++
                        continue
                    }

                    if (c == '"') {
                        inString = true
                        escaped = false
                        out.append(' ')
                        continue
                    }

                    if (c == '\'') {
                        inChar = true
                        escaped = false
                        out.append(' ')
                        continue
                    }

                    out.append(c)
                }

                return out.toString()
            }

            def stripJavaCommentsOnly = { String input ->
                if (input == null || input.isEmpty()) {
                    return input
                }

                def out = new StringBuilder(input.length())
                boolean inLineComment = false
                boolean inBlockComment = false

                for (int i = 0; i < input.length(); i++) {
                    char c = input.charAt(i)
                    char n = (i + 1) < input.length() ? input.charAt(i + 1) : (char) 0

                    if (inLineComment) {
                        if (c == '\n') {
                            inLineComment = false
                            out.append(c)
                        } else {
                            out.append(' ')
                        }
                        continue
                    }

                    if (inBlockComment) {
                        if (c == '*' && n == '/') {
                            inBlockComment = false
                            out.append(' ')
                            out.append(' ')
                            i++
                        } else {
                            out.append(c == '\n' ? c : ' ')
                        }
                        continue
                    }

                    if (c == '/' && n == '/') {
                        inLineComment = true
                        out.append(' ')
                        out.append(' ')
                        i++
                        continue
                    }

                    if (c == '/' && n == '*') {
                        inBlockComment = true
                        out.append(' ')
                        out.append(' ')
                        i++
                        continue
                    }

                    out.append(c)
                }

                return out.toString()
            }

            def allowMarkerPattern = java.util.regex.Pattern.compile(
                    '(?m)^(?:\\s*//|\\s*/\\*)\\s*EVCS_ALLOW_ASYNC_CONTEXT_LOSS\\s*:\\s*\\S.+$'
            )

                // Reactor schedulers that typically jump threads without TenantContext/MDC propagation
                // Allowed alternatives: inject a managed Scheduler bean, or wrap a managed executor via Schedulers.fromExecutor/fromExecutorService.
                def reactorBadSchedulersPattern = java.util.regex.Pattern.compile(
                    '\\b(?:reactor\\.core\\.scheduler\\.)?Schedulers\\s*\\.\\s*(?:parallel|boundedElastic|elastic|immediate|single|newParallel|newBoundedElastic|newSingle)\\s*\\('
                )

            def simpleRules = [
                    [
                            id     : 'PARALLEL_STREAM',
                            pattern: java.util.regex.Pattern.compile('\\.parallelStream\\s*\\('),
                            message: 'Avoid parallelStream() in production code (uses common pool, loses TenantContext/MDC). Use a managed executor with context propagation.'
                    ],
                    [
                            id     : 'STREAM_PARALLEL',
                            pattern: java.util.regex.Pattern.compile('\\.parallel\\s*\\('),
                            message: 'Avoid Stream.parallel() in production code (uses common pool, loses TenantContext/MDC). Use a managed executor with context propagation.'
                    ],
                    [
                            id     : 'FORK_JOIN_COMMON_POOL',
                            pattern: java.util.regex.Pattern.compile('\\bForkJoinPool\\s*\\.\\s*commonPool\\s*\\('),
                            message: 'Avoid ForkJoinPool.commonPool() in production code. Use a managed/context-propagating executor.'
                        ],
                        [
                            id     : 'REACTOR_BAD_SCHEDULERS_FACTORY',
                            pattern: reactorBadSchedulersPattern,
                            message: 'Avoid Reactor Schedulers.parallel/boundedElastic/etc in production code (thread switch loses TenantContext/MDC). Use a managed Scheduler or wrap a managed executor via Schedulers.fromExecutorService.'
                    ]
            ]

            def cfAsyncPatterns = [
                    [
                            id     : 'CF_RUN_ASYNC_NO_EXECUTOR',
                            pattern: java.util.regex.Pattern.compile('\\bCompletableFuture\\s*\\.\\s*runAsync\\s*\\('),
                            message: 'CompletableFuture.runAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                            id     : 'CF_SUPPLY_ASYNC_NO_EXECUTOR',
                            pattern: java.util.regex.Pattern.compile('\\bCompletableFuture\\s*\\.\\s*supplyAsync\\s*\\('),
                            message: 'CompletableFuture.supplyAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                        id     : 'CF_THEN_APPLY_ASYNC_NO_EXECUTOR',
                        pattern: java.util.regex.Pattern.compile('\\.thenApplyAsync\\s*\\('),
                        message: 'CompletableFuture.thenApplyAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                        id     : 'CF_THEN_ACCEPT_ASYNC_NO_EXECUTOR',
                        pattern: java.util.regex.Pattern.compile('\\.thenAcceptAsync\\s*\\('),
                        message: 'CompletableFuture.thenAcceptAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                        id     : 'CF_THEN_RUN_ASYNC_NO_EXECUTOR',
                        pattern: java.util.regex.Pattern.compile('\\.thenRunAsync\\s*\\('),
                        message: 'CompletableFuture.thenRunAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                        id     : 'CF_THEN_COMPOSE_ASYNC_NO_EXECUTOR',
                        pattern: java.util.regex.Pattern.compile('\\.thenComposeAsync\\s*\\('),
                        message: 'CompletableFuture.thenComposeAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                        id     : 'CF_HANDLE_ASYNC_NO_EXECUTOR',
                        pattern: java.util.regex.Pattern.compile('\\.handleAsync\\s*\\('),
                        message: 'CompletableFuture.handleAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ],
                    [
                        id     : 'CF_WHEN_COMPLETE_ASYNC_NO_EXECUTOR',
                        pattern: java.util.regex.Pattern.compile('\\.whenCompleteAsync\\s*\\('),
                        message: 'CompletableFuture.whenCompleteAsync must pass an explicit Executor (avoid common pool; preserve TenantContext/MDC).'
                    ]
            ]

                    def reactorShiftPatterns = [
                        [
                            id     : 'REACTOR_PUBLISH_ON_INLINE_BAD_SCHEDULER',
                            pattern: java.util.regex.Pattern.compile('\\.publishOn\\s*\\('),
                            message: 'Do not call publishOn(...) with Schedulers.parallel/boundedElastic/etc inline. Inject a managed Scheduler or wrap a managed executor via Schedulers.fromExecutorService.'
                        ],
                        [
                            id     : 'REACTOR_SUBSCRIBE_ON_INLINE_BAD_SCHEDULER',
                            pattern: java.util.regex.Pattern.compile('\\.subscribeOn\\s*\\('),
                            message: 'Do not call subscribeOn(...) with Schedulers.parallel/boundedElastic/etc inline. Inject a managed Scheduler or wrap a managed executor via Schedulers.fromExecutorService.'
                        ]
                    ]

                        def asyncAnnotationPattern = java.util.regex.Pattern.compile('\\@Async\\b')

            def violations = []

            def lineOfIndex = { String s, int idx ->
                int line = 1
                for (int i = 0; i < idx && i < s.length(); i++) {
                    if (s.charAt(i) == '\n') {
                        line++
                    }
                }
                return line
            }

            def findMatchingParen = { String s, int openIdx ->
                int depth = 0
                for (int i = openIdx; i < s.length(); i++) {
                    char c = s.charAt(i)
                    if (c == '(') {
                        depth++
                    } else if (c == ')') {
                        depth--
                        if (depth == 0) {
                            return i
                        }
                    }
                }
                return -1
            }

            def hasTopLevelComma = { String s, int startIdx, int endIdx ->
                int paren = 0
                int brace = 0
                int bracket = 0

                for (int i = startIdx; i < endIdx && i < s.length(); i++) {
                    char c = s.charAt(i)
                    if (c == '(') {
                        paren++
                    } else if (c == ')') {
                        paren = Math.max(0, paren - 1)
                    } else if (c == '{') {
                        brace++
                    } else if (c == '}') {
                        brace = Math.max(0, brace - 1)
                    } else if (c == '[') {
                        bracket++
                    } else if (c == ']') {
                        bracket = Math.max(0, bracket - 1)
                    } else if (c == ',' && paren == 0 && brace == 0 && bracket == 0) {
                        return true
                    }
                }

                return false
            }

            srcDir.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                if (!f.name.endsWith('.java')) {
                    return
                }

                def original = f.getText('UTF-8')

                // Escape hatch (must be explicit + justified, near the top of file)
                def head = original
                def firstNewline = 0
                int linesToCheck = 40
                for (int i = 0; i < original.length() && linesToCheck > 0; i++) {
                    if (original.charAt(i) == '\n') {
                        firstNewline = i
                        linesToCheck--
                    }
                }
                if (firstNewline > 0) {
                    head = original.substring(0, firstNewline)
                }

                if (allowMarkerPattern.matcher(head).find()) {
                    return
                }

                def content = stripJavaCommentsAndStrings(original)
                def commentStripped = stripJavaCommentsOnly(original)

                simpleRules.each { rule ->
                    def matcher = rule.pattern.matcher(content)
                    while (matcher.find()) {
                        violations << [file: f, line: lineOfIndex(content, matcher.start()), ruleId: rule.id, message: rule.message]
                    }
                }

                cfAsyncPatterns.each { rule ->
                    def matcher = rule.pattern.matcher(content)
                    while (matcher.find()) {
                        int openParenIdx = matcher.end() - 1
                        int closeParenIdx = findMatchingParen(content, openParenIdx)
                        if (closeParenIdx < 0) {
                            break
                        }

                        if (!hasTopLevelComma(content, openParenIdx + 1, closeParenIdx)) {
                            violations << [file: f, line: lineOfIndex(content, matcher.start()), ruleId: rule.id, message: rule.message]
                        }

                        matcher.region(Math.min(closeParenIdx + 1, content.length()), content.length())
                    }
                }

                reactorShiftPatterns.each { rule ->
                    def matcher = rule.pattern.matcher(content)
                    while (matcher.find()) {
                        int openParenIdx = matcher.end() - 1
                        int closeParenIdx = findMatchingParen(content, openParenIdx)
                        if (closeParenIdx < 0) {
                            break
                        }

                        def args = content.substring(openParenIdx + 1, closeParenIdx)
                        if (reactorBadSchedulersPattern.matcher(args).find()) {
                            violations << [file: f, line: lineOfIndex(content, matcher.start()), ruleId: rule.id, message: rule.message]
                        }

                        matcher.region(Math.min(closeParenIdx + 1, content.length()), content.length())
                    }
                }

                // Spring @Async must be explicit to avoid default executors that drop TenantContext/MDC
                def asyncMatcher = asyncAnnotationPattern.matcher(commentStripped)
                while (asyncMatcher.find()) {
                    int idx = asyncMatcher.end()
                    while (idx < commentStripped.length() && Character.isWhitespace(commentStripped.charAt(idx))) {
                        idx++
                    }

                    if (idx >= commentStripped.length() || commentStripped.charAt(idx) != '(') {
                        violations << [
                                file  : f,
                                line  : lineOfIndex(commentStripped, asyncMatcher.start()),
                                ruleId: 'SPRING_ASYNC_MUST_SPECIFY_EXECUTOR',
                                message: 'Spring @Async must specify an explicit executor bean name (avoid default executor; preserve TenantContext/MDC). Use @Async("<executorBean>").'
                        ]
                        continue
                    }

                    int openParenIdx = idx
                    int closeParenIdx = findMatchingParen(commentStripped, openParenIdx)
                    if (closeParenIdx < 0) {
                        break
                    }

                    def args = commentStripped.substring(openParenIdx + 1, closeParenIdx)
                    if (args.trim().isEmpty()) {
                        violations << [
                                file  : f,
                                line  : lineOfIndex(commentStripped, asyncMatcher.start()),
                                ruleId: 'SPRING_ASYNC_MUST_SPECIFY_EXECUTOR',
                                message: 'Spring @Async must specify an explicit executor bean name (avoid default executor; preserve TenantContext/MDC). Use @Async("<executorBean>").'
                        ]
                    }

                    asyncMatcher.region(Math.min(closeParenIdx + 1, commentStripped.length()), commentStripped.length())
                }
            }

            if (!violations.isEmpty()) {
                def details = violations.collect { v ->
                    "- ${v.file}:L${v.line} [${v.ruleId}] ${v.message}"
                }.join('\n')

                def message =
                        "Async/parallel patterns that can lose TenantContext/traceId found in production code.\n" +
                                "Fix: provide an explicit managed executor/scheduler with context propagation.\n" +
                                "Escape hatch (exceptional only): add within first 40 lines: \"// EVCS_ALLOW_ASYNC_CONTEXT_LOSS: <reason>\"\n" +
                                details + "\n"

                if (gateMode == 'warn') {
                    logger.warn("[EVCS GATE][async][WARN]\n" + message)
                    return
                }

                throw new GradleException(message)
            }
        }
    }

    tasks.matching { it.name == 'check' }.configureEach {
        dependsOn(tasks.named('forbidThreadingPrimitives'))
        dependsOn(tasks.named('forbidAsyncContextLoss'))
    }

    def hasBootApplication = fileTree('src/main/java') {
        include '**/*Application.java'
    }.files

    tasks.named('bootJar') {
        enabled = !hasBootApplication.isEmpty()
    }
    tasks.named('jar') {
        enabled = hasBootApplication.isEmpty()
    }

    // Expose build metadata via Spring Boot Actuator /actuator/info (build.*)
    // This generates build-info.properties during bootJar builds.
    plugins.withId('org.springframework.boot') {
        springBoot {
            buildInfo()
        }
    }

}

// Docker构建配置
configure(subprojects.findAll { !it.name.endsWith('-common') }) {
    apply plugin: 'com.palantir.docker'

    def registryHost = 'registry.cn-hangzhou.aliyuncs.com'

    docker {
        name "${registryHost}/${project.group}/${project.name}:${project.version}"
        dockerfile file('Dockerfile')
        files bootJar.archiveFile
        buildArgs(['JAR_FILE': "${bootJar.archiveFileName}"])
        tag 'latest', "${registryHost}/${project.group}/${project.name}:latest"
    }
}

// K8s 内部测试环境：无需 Docker Daemon 的镜像构建/推送（Jib）
// 用法示例：
//   ./gradlew pushK8sImages -Devcs.k8s.registry=192.168.20.235:5000 -Devcs.k8s.tag=dev
def evcsK8sRegistry = System.getProperty('evcs.k8s.registry') ?: System.getenv('EVCS_K8S_REGISTRY') ?: '192.168.20.235:5000'
def evcsK8sTag = System.getProperty('evcs.k8s.tag') ?: System.getenv('EVCS_IMAGE_TAG') ?: 'dev'

def evcsK8sImageMap = [
        'evcs-auth'      : 'evcs/auth-service',
        'evcs-config'    : 'evcs/config-server',
        'evcs-eureka'    : 'evcs/eureka',
        'evcs-gateway'   : 'evcs/gateway',
        'evcs-monitoring': 'evcs/monitoring-service',
        'evcs-order'     : 'evcs/order-service',
        'evcs-payment'   : 'evcs/payment-service',
        'evcs-protocol'  : 'evcs/protocol-service',
        'evcs-station'   : 'evcs/station-service',
        'evcs-tenant'    : 'evcs/tenant-service'
]

configure(subprojects.findAll { evcsK8sImageMap.containsKey(it.name) }) {
    apply plugin: 'com.google.cloud.tools.jib'

    def imageName = evcsK8sImageMap[project.name]

    jib {
        from {
            // 避免访问 Docker Hub（内部环境可能超时/被拦截），使用镜像加速源
            image = 'docker.m.daocloud.io/library/eclipse-temurin:21-jre-alpine'
        }
        to {
            image = "${evcsK8sRegistry}/${imageName}:${evcsK8sTag}"
        }
        allowInsecureRegistries = true
        container {
            creationTime = 'USE_CURRENT_TIMESTAMP'
        }
    }
}

tasks.register('pushK8sImages') {
    group = 'distribution'
    description = 'Build and push service images to the K8s private registry via Jib (no local Docker required).'

    dependsOn(
            ':evcs-auth:jib',
            ':evcs-config:jib',
            ':evcs-eureka:jib',
            ':evcs-gateway:jib',
            ':evcs-monitoring:jib',
            ':evcs-order:jib',
            ':evcs-payment:jib',
            ':evcs-protocol:jib',
            ':evcs-station:jib',
            ':evcs-tenant:jib'
    )
}
