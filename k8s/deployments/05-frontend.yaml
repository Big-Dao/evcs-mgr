# NOTE: This manifest contains placeholders like ${EVCS_K8S_REGISTRY}/${EVCS_IMAGE_TAG}.
# Apply via k8s/deploy.sh (preferred). It runs envsubst with the required variables.
# Do NOT run: kubectl apply -f k8s/deployments/<file>.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: ${EVCS_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${EVCS_NODE_NAME}
      containers:
      - name: admin-frontend
        image: ${EVCS_K8S_REGISTRY}/evcs/admin-frontend:${EVCS_IMAGE_TAG}
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: evcs-common-config
        resources:
          limits:
            cpu: "0.5"
            memory: "256Mi"
          requests:
            cpu: "0.1"
            memory: "64Mi"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: evcs-admin
  namespace: ${EVCS_NAMESPACE}
spec:
  selector:
    app: admin-frontend
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30090
