apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: evcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      nodeSelector:
        role: core
      initContainers:
      - name: wait-config-server
        image: busybox:1.36
        envFrom:
        - configMapRef:
            name: evcs-common-config
        command:
        - sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            wget -q --spider ${CONFIG_SERVER_URL}/actuator/health
            rc=$?
            # 4: Network failure (e.g. connection refused/timeout). Other codes mean the server is reachable.
            if [ "$rc" -ne 4 ]; then
              exit 0
            fi
            if [ "$i" -ge 60 ]; then
              echo "config-server not reachable after 120s" >&2
              exit 1
            fi
            echo "waiting for config-server (attempt ${i}/60)..."
            sleep 2
          done
      containers:
      - name: payment-service
        image: ${EVCS_K8S_REGISTRY}/evcs/payment-service:${EVCS_IMAGE_TAG}
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: evcs-common-config
        - secretRef:
            name: evcs-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: evcs-common-config
              key: EUREKA_SERVER_URL
        resources:
          limits:
            cpu: "0.8"
            memory: "512Mi"
          requests:
            cpu: "0.3"
            memory: "256Mi"
---
apiVersion: v1
