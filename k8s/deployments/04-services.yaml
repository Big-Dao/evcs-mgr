# NOTE: This manifest contains placeholders like ${EVCS_K8S_REGISTRY}/${EVCS_IMAGE_TAG}.
# Apply via k8s/deploy.sh (preferred). It runs envsubst with the required variables.
# Do NOT run: kubectl apply -f k8s/deployments/<file>.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: evcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      nodeSelector:
        role: core
      containers:
      - name: auth-service
        image: ${EVCS_K8S_REGISTRY}/evcs/auth-service:${EVCS_IMAGE_TAG}
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: evcs-common-config
        - secretRef:
            name: evcs-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: evcs-common-config
              key: EUREKA_SERVER_URL
        resources:
          limits:
            cpu: "0.8"
            memory: "512Mi"
          requests:
            cpu: "0.3"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: evcs-auth
  namespace: evcs
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081
    targetPort: 8081
    name: http

