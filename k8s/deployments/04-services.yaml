apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: evcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      nodeSelector:
        role: core
      containers:
      - name: auth-service
        image: evcs/auth-service:dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: evcs-common-config
        - secretRef:
            name: evcs-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0"
        resources:
          limits:
            cpu: "0.8"
            memory: "512Mi"
          requests:
            cpu: "0.3"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: evcs-auth
  namespace: evcs
spec:
  selector:
    app: auth-service
  ports:
  - port: 8080
    targetPort: 8080

