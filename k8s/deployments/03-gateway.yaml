apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: evcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        role: core
      initContainers:
      - name: wait-config-server
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            wget -q --spider http://${EVCS_CONFIG_IP}:8888/ && exit 0
            rc=$?
            # 4: Network failure (e.g. connection refused/timeout). Other codes mean the server is reachable.
            if [ "$rc" -ne 4 ]; then
              exit 0
            fi
            if [ "$i" -ge 60 ]; then
              echo "config-server not reachable after 120s" >&2
              exit 1
            fi
            echo "waiting for config-server (attempt ${i}/60)..."
            sleep 2
          done
      containers:
      - name: gateway
        image: ${EVCS_K8S_REGISTRY}/evcs/gateway:${EVCS_IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: evcs-common-config
        - secretRef:
            name: evcs-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0"
        resources:
          limits:
            cpu: "0.8"
            memory: "512Mi"
          requests:
            cpu: "0.3"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: evcs-gateway
  namespace: evcs
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
