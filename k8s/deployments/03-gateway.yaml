# NOTE: This manifest contains placeholders like ${EVCS_K8S_REGISTRY}/${EVCS_IMAGE_TAG}.
# Apply via k8s/deploy.sh (preferred). It runs envsubst with the required variables.
# Do NOT run: kubectl apply -f k8s/deployments/<file>.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ${EVCS_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${EVCS_NODE_NAME}
      initContainers:
      - name: wait-config-server
        image: busybox:1.36
        envFrom:
        - configMapRef:
            name: evcs-common-config
        command:
        - sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            wget -q --spider ${CONFIG_SERVER_URL}/actuator/health
            rc=$?
            # 4: Network failure (e.g. connection refused/timeout). Other codes mean the server is reachable.
            if [ "$rc" -ne 4 ]; then
              exit 0
            fi
            if [ "$i" -ge 60 ]; then
              echo "config-server not reachable after 120s" >&2
              exit 1
            fi
            echo "waiting for config-server (attempt ${i}/60)..."
            sleep 2
          done
      containers:
      - name: gateway
        image: ${EVCS_K8S_REGISTRY}/evcs/gateway:${EVCS_IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: evcs-common-config
        - secretRef:
            name: evcs-secrets
        env:
        - name: EVCS_K8S_REGISTRY
          value: "${EVCS_K8S_REGISTRY}"
        - name: EVCS_IMAGE_TAG
          value: "${EVCS_IMAGE_TAG}"
        - name: EVCS_GIT_COMMIT
          value: "${EVCS_GIT_COMMIT}"
        - name: EVCS_GIT_BRANCH
          value: "${EVCS_GIT_BRANCH}"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: evcs-common-config
              key: EUREKA_SERVER_URL
        resources:
          limits:
            cpu: "1"
            memory: "768Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: evcs-gateway
  namespace: ${EVCS_NAMESPACE}
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
