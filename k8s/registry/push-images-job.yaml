apiVersion: batch/v1
kind: Job
metadata:
  name: evcs-push-dev-images
  namespace: evcs
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: evcs-push-dev-images
    spec:
      restartPolicy: Never
      nodeSelector:
        role: core
      hostPID: true
      containers:
      - name: pusher
        image: docker.m.daocloud.io/library/alpine:3.20
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: REGISTRY
          value: "192.168.20.235:5000"
        command:
        - /bin/sh
        - -lc
        - |
          set -e
          echo "Using registry: $REGISTRY"
          K3S=/host/usr/local/bin/k3s
          if [ ! -x "$K3S" ]; then
            echo "ERROR: host k3s binary not found at $K3S" >&2
            exit 1
          fi

          echo "Listing local containerd images (evcs/*:dev)..."
          imgs=$($K3S ctr images ls -q | grep '^evcs/' | grep ':dev$' || true)
          echo "$imgs"

          if [ -z "$imgs" ]; then
            echo "No evcs/*:dev images found in host containerd." >&2
            exit 2
          fi

          for img in $imgs; do
            target="$REGISTRY/$img"
            echo "Tag: $img -> $target"
            $K3S ctr images tag "$img" "$target"
            echo "Push: $target (plain http)"
            $K3S ctr images push --plain-http "$target"
          done

          echo "Done."
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
