apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: evcs-registry-config
  namespace: evcs
spec:
  selector:
    matchLabels:
      app: evcs-registry-config
  template:
    metadata:
      labels:
        app: evcs-registry-config
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
      - operator: Exists
      containers:
      - name: configure
        image: docker.m.daocloud.io/library/busybox:1.36
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /host/etc/rancher/k3s
          cat > /host/etc/rancher/k3s/registries.yaml <<'EOF'
          mirrors:
            "192.168.20.235:5000":
              endpoint:
                - "http://192.168.20.235:5000"
          configs:
            "192.168.20.235:5000":
              tls:
                insecure_skip_verify: true
          EOF
          echo "Wrote /etc/rancher/k3s/registries.yaml on $(hostname)"
          # k3s needs a restart to take effect; keep pod alive for auditability
          sleep 3650d
        volumeMounts:
        - name: host-etc-rancher-k3s
          mountPath: /host/etc/rancher/k3s
      volumes:
      - name: host-etc-rancher-k3s
        hostPath:
          path: /etc/rancher/k3s
          type: DirectoryOrCreate
