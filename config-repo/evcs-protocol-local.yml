server:
  port: 8085

spring:
  application:
    name: evcs-protocol
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  rabbitmq:
    enabled: true
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    virtual-host: ${RABBIT_VHOST:/}

logging:
  level:
    com.evcs.protocol: info
    com.evcs.protocol.mq: debug

evcs:
  internal:
    api:
      enabled: true
      # 调用 station 内部端点时携带的共享令牌；生产必须通过 EVCS_INTERNAL_API_TOKEN 环境变量注入
      token: ${EVCS_INTERNAL_API_TOKEN}
      header-name: X-Internal-Token
  protocol:
    resilience:
      station-service-circuit-breaker:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50.0
        wait-duration-in-open-state-ms: 15000
        permitted-number-of-calls-in-half-open-state: 3
      station-service-retry:
        enabled: true
        max-attempts: 3
        delay: 200
        multiplier: 2.0
        max-delay: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}

jwt:
  # 必填：生产必须通过 JWT_SECRET 环境变量注入至少 32 字符的随机密钥
  secret: ${JWT_SECRET}
