server:
  port: 8080

spring:
  application:
    name: evcs-gateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=X-Request-Id RETAIN_UNIQUE
      routes:
        # 认证服务路由（前端使用/api/auth/**）
        - id: evcs-auth-api
          # NOTE: 内测集群 CoreDNS 解析异常时可能返回 198.18.*，这里通过注入 Service ClusterIP 直连。
          uri: http://${EVCS_AUTH_IP}:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1  # 去掉/api，保留/auth，转发到auth服务的/api/login等
        
        # 租户/Dashboard服务路由
        - id: evcs-dashboard
          uri: http://${EVCS_TENANT_IP}:8086
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到tenant服务的/dashboard/**
        
        # 租户管理路由
        - id: evcs-tenant
          uri: http://${EVCS_TENANT_IP}:8086
          predicates:
            - Path=/api/tenant/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到tenant服务的/tenant/**
        
        # 用户管理路由（属于auth服务）
        - id: evcs-user
          uri: http://${EVCS_AUTH_IP}:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到auth服务的/user/**
        
        # 角色管理路由（属于auth服务）
        - id: evcs-role
          uri: http://${EVCS_AUTH_IP}:8081
          predicates:
            - Path=/api/role/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到auth服务的/role/**
        
        # 菜单管理路由（属于auth服务）
        - id: evcs-menu
          uri: http://${EVCS_AUTH_IP}:8081
          predicates:
            - Path=/api/menu/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到auth服务的/menu/**
        
        # 站点服务路由
        - id: evcs-station
          uri: http://${EVCS_STATION_IP}:8082
          predicates:
            - Path=/api/station/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到station服务的/station/**

        # 站点服务 v1 API 路由（聚合/版本化接口）
        - id: evcs-station-v1
          uri: http://${EVCS_STATION_IP}:8082
          predicates:
            - Path=/api/v1/charging-stations/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到station服务的/v1/charging-stations/**
        
        # 充电桩路由（属于station服务）
        - id: evcs-charger
          uri: http://${EVCS_STATION_IP}:8082
          predicates:
            - Path=/api/charger/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到station服务的/charger/**
        
        # 订单服务路由
        - id: evcs-order
          uri: http://${EVCS_ORDER_IP}:8083
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到order服务的/order/**
        
        # 计费方案路由（属于order服务）
        - id: evcs-billing
          uri: http://${EVCS_ORDER_IP}:8083
          predicates:
            - Path=/api/billing/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到order服务的/billing/**
        
        # 支付服务路由
        - id: evcs-payment
          uri: http://${EVCS_PAYMENT_IP}:8084
          predicates:
            - Path=/api/payment/**, /api/reconciliation/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到payment服务的/payments/** 或 /reconciliation/**

        # ===== Actuator 透传（版本识别/排障） =====
        # 约定：前端通过 /api/actuator/<component>/info 或 /api/actuator/<component>/health 访问。
        # 注意：这里使用 RewritePath 保留 /actuator 前缀，避免 StripPrefix 误删。

        # Gateway 自身 Actuator（通过 /api 前缀访问，便于前端同源调用）
        - id: evcs-gateway-actuator
          uri: http://127.0.0.1:8080
          predicates:
            - Path=/api/actuator/gateway/**
          filters:
            - RewritePath=/api/actuator/gateway/(?<segment>.*), /actuator/${segment}

        # Auth 服务 Actuator
        - id: evcs-auth-actuator
          uri: http://${EVCS_AUTH_IP}:8081
          predicates:
            - Path=/api/actuator/auth/**
          filters:
            - RewritePath=/api/actuator/auth/(?<segment>.*), /actuator/${segment}

        # Tenant 服务 Actuator
        - id: evcs-tenant-actuator
          uri: http://${EVCS_TENANT_IP}:8086
          predicates:
            - Path=/api/actuator/tenant/**
          filters:
            - RewritePath=/api/actuator/tenant/(?<segment>.*), /actuator/${segment}

        # Station 服务 Actuator
        - id: evcs-station-actuator
          uri: http://${EVCS_STATION_IP}:8082
          predicates:
            - Path=/api/actuator/station/**
          filters:
            - RewritePath=/api/actuator/station/(?<segment>.*), /actuator/${segment}

        # Order 服务 Actuator
        - id: evcs-order-actuator
          uri: http://${EVCS_ORDER_IP}:8083
          predicates:
            - Path=/api/actuator/order/**
          filters:
            - RewritePath=/api/actuator/order/(?<segment>.*), /actuator/${segment}

        # Payment 服务 Actuator
        - id: evcs-payment-actuator
          uri: http://${EVCS_PAYMENT_IP}:8084
          predicates:
            - Path=/api/actuator/payment/**
          filters:
            - RewritePath=/api/actuator/payment/(?<segment>.*), /actuator/${segment}

        # 监控聚合服务路由（前端使用 /api/monitoring/**）
        - id: evcs-monitoring
          uri: http://${EVCS_MONITORING_IP}:8087
          predicates:
            - Path=/api/monitoring/**, /api/v1/monitoring/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到monitoring服务的/monitoring/** 或 /v1/monitoring/**
    loadbalancer:
      retry:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://10.43.227.140:8761/eureka/}

logging:
  level:
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{X-Request-Id}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    prometheus:
      enabled: true

evcs:
  gateway:
    security:
      internal-api-block:
        enabled: true
        path-prefix: /internal/api/

      internal-api-route-guard:
        enabled: true
        forbidden-path-prefixes:
          - /internal/api/
          - /internal/api
