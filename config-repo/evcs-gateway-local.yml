server:
  port: 8080

spring:
  application:
    name: evcs-gateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=X-Request-Id RETAIN_UNIQUE
      routes:
        # 认证服务路由（前端使用/api/auth/**）
        - id: evcs-auth-api
          # NOTE: 内测集群 CoreDNS 解析异常时可能返回 198.18.*，这里临时直连 Service ClusterIP。
          uri: http://10.43.175.191:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1  # 去掉/api，保留/auth，转发到auth服务的/api/login等
        
        # 租户/Dashboard服务路由
        - id: evcs-dashboard
          uri: http://10.43.76.196:8086
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到tenant服务的/dashboard/**
        
        # 租户管理路由
        - id: evcs-tenant
          uri: http://10.43.76.196:8086
          predicates:
            - Path=/api/tenant/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到tenant服务的/tenant/**
        
        # 用户管理路由（属于auth服务）
        - id: evcs-user
          uri: http://10.43.175.191:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到auth服务的/user/**
        
        # 角色管理路由（属于auth服务）
        - id: evcs-role
          uri: http://10.43.175.191:8081
          predicates:
            - Path=/api/role/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到auth服务的/role/**
        
        # 菜单管理路由（属于auth服务）
        - id: evcs-menu
          uri: http://10.43.175.191:8081
          predicates:
            - Path=/api/menu/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到auth服务的/menu/**
        
        # 站点服务路由
        - id: evcs-station
          uri: http://10.43.12.37:8082
          predicates:
            - Path=/api/station/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到station服务的/station/**
        
        # 充电桩路由（属于station服务）
        - id: evcs-charger
          uri: http://10.43.12.37:8082
          predicates:
            - Path=/api/charger/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到station服务的/charger/**
        
        # 订单服务路由
        - id: evcs-order
          uri: lb://EVCS-ORDER
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到order服务的/order/**
        
        # 计费方案路由（属于order服务）
        - id: evcs-billing
          uri: lb://EVCS-ORDER
          predicates:
            - Path=/api/billing/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到order服务的/billing/**
        
        # 支付服务路由
        - id: evcs-payment
          uri: http://10.43.178.61:8084
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1  # 去掉/api，转发到payment服务的/payments/**
    loadbalancer:
      retry:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://10.43.227.140:8761/eureka/}

logging:
  level:
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{X-Request-Id}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    prometheus:
      enabled: true
