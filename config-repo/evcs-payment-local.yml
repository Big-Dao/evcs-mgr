server:
  port: 8084

spring:
  application:
    name: evcs-payment
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:evcs_mgr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: HikariCP-Payment
      minimum-idle: 10
      maximum-pool-size: 30
      auto-commit: true
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 3
      lettuce:
        pool:
          max-active: 100
          max-idle: 10
          min-idle: 0
          max-wait: 2000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.evcs.payment.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.evcs.payment: info
    com.evcs.payment.mapper: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

evcs:
  tenant:
    enabled: true
    tenant-id-column: tenant_id
    ignore-tables:
      - sys_tenant
      - sys_user
      - sys_role
      - sys_permission
    default-tenant-id: 1
  payment:
    processing-reconcile:
      # 是否启用 PROCESSING 订单轮询补偿（默认关闭）
      enabled: false
      # 任务初始延迟（毫秒）
      initial-delay-ms: 60000
      # 任务执行间隔（毫秒）
      fixed-delay-ms: 60000
      # 仅处理创建时间早于该阈值的订单（分钟），避免刚创建就被轮询
      min-age-minutes: 2
      # 每个租户每次轮询最多处理的订单数
      batch-size-per-tenant: 50
      # 每次轮询最多扫描的租户数量
      max-tenants-per-run: 50
    refunding-reconcile:
      # 是否启用 REFUNDING 订单轮询补偿（默认关闭）
      enabled: false
      # 任务初始延迟（毫秒）
      initial-delay-ms: 60000
      # 任务执行间隔（毫秒）
      fixed-delay-ms: 60000
      # 仅处理退款请求时间/创建时间早于该阈值的订单（分钟），避免刚发起退款就被轮询
      min-age-minutes: 2
      # 每个租户每次轮询最多处理的订单数
      batch-size-per-tenant: 50
      # 每次轮询最多扫描的租户数量
      max-tenants-per-run: 50
    rabbitmq:
      enabled: true
      queue:
        payment-success: payment.success.queue
        payment-failure: payment.failure.queue
        refund-success: refund.success.queue
        payment-callback: payment.callback.queue
        payment-dlq: payment.dlq
      exchange:
        payment-direct: payment.direct.exchange
        payment-topic: payment.topic.exchange
        payment-dlx: payment.dlx.exchange
      routing-key:
        payment-success: payment.success
        payment-failure: payment.failure
        refund-success: refund.success
        payment-callback: payment.callback
    monitoring:
      enabled: true
      health:
        database-validation-query: SELECT 1
        api:
          # 外部API健康检查端点（可选）：用于探测第三方/外部依赖。
          # 注意：不要配置为本服务的 /actuator/health，否则会造成“自我探测”并导致健康状态误判。
          endpoints: []
          timeout-ms: 3000
          expected-response-keyword: "UP"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
