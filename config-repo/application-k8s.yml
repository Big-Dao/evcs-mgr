# K8s环境通用配置 - 覆盖local profile的默认值
eureka:
  client:
    service-url:
      defaultZone: http://evcs-eureka:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

spring:
  datasource:
    url: jdbc:postgresql://evcs-postgres:5432/evcs_mgr?sslmode=disable
    username: postgres
    password: postgres
  data:
    redis:
      host: evcs-redis
      port: 6379
  rabbitmq:
    host: evcs-rabbitmq
    port: 5672
    username: guest
    password: guest

# Actuator /actuator/info 默认不会输出 info.*（env contributor 默认关闭），
# 这里开启后可用于“版本识别/排障”页面展示镜像 tag / registry 等。
management:
  info:
    env:
      enabled: true

# 版本识别信息（用于 /actuator/info，便于排障确认是否为版本问题）
info:
  evcs:
    imageTag: ${EVCS_IMAGE_TAG:unknown}
    registry: ${EVCS_K8S_REGISTRY:unknown}
    gitCommit: ${EVCS_GIT_COMMIT:unknown}
    gitBranch: ${EVCS_GIT_BRANCH:unknown}

# 支付服务补偿轮询（默认关闭；仅支付服务读取该配置）
evcs:
  payment:
    processing-reconcile:
      enabled: false
      initial-delay-ms: 60000
      fixed-delay-ms: 60000
      min-age-minutes: 2
      batch-size-per-tenant: 50
      max-tenants-per-run: 50
