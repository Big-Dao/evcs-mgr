name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -x test --no-daemon

    - name: Quality gates and tests (check)
      # ./gradlew check = 全模块单元/集成测试 + forbidThreadingPrimitives / forbidAsyncContextLoss 门禁
      run: ./gradlew check --no-daemon

    - name: Coverage verification (gradual gate - warning only)
      continue-on-error: true
      run: ./gradlew jacocoTestCoverageVerification -PevcsCoverageGate=true --no-daemon

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/build/test-results/test/*.xml'

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/**'

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        service: [evcs-auth, evcs-config, evcs-eureka, evcs-gateway, evcs-order, evcs-payment, evcs-protocol, evcs-station, evcs-tenant]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build JAR for specific service
      run: ./gradlew :${{ matrix.service }}:build -x test --no-daemon

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image for service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service }}/Dockerfile
        push: false
        tags: ${{ matrix.service }}:latest
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}
        build-args: |
          BUILDKIT_INLINE_CACHE=1
