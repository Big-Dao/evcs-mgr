name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean install -DskipTests
    
    - name: Run tests
      run: mvn test
  
  docker-build:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [evcs-auth, evcs-config, evcs-eureka, evcs-gateway, evcs-order, evcs-payment, evcs-protocol, evcs-station, evcs-tenant]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build ${{ matrix.service }}
      run: mvn clean package -pl ${{ matrix.service }} -am -DskipTests
    
    - name: Build Docker image
      run: |
        docker build -t ${{ matrix.service }}:latest ./${{ matrix.service }}
