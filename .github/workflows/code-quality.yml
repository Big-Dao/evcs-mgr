name: Code Quality and Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests (key modules)
      run: |
        ./gradlew \
          :evcs-common:test \
          :evcs-gateway:test \
          :evcs-auth:test \
          :evcs-tenant:test \
          :evcs-station:test \
          :evcs-order:test \
          :evcs-payment:test \
          :evcs-protocol:test \
          --continue --no-daemon

    - name: Run integration tests
      run: ./gradlew :evcs-integration:test --continue --no-daemon

    - name: Generate test coverage report (key modules)
      run: |
        ./gradlew \
          :evcs-common:jacocoTestReport \
          :evcs-gateway:jacocoTestReport \
          :evcs-auth:jacocoTestReport \
          :evcs-tenant:jacocoTestReport \
          :evcs-station:jacocoTestReport \
          :evcs-order:jacocoTestReport \
          :evcs-payment:jacocoTestReport \
          :evcs-protocol:jacocoTestReport \
          :evcs-integration:jacocoTestReport \
          --continue --no-daemon

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: evcs-common/build/reports/jacoco/test/jacocoTestReport.xml,evcs-gateway/build/reports/jacoco/test/jacocoTestReport.xml,evcs-auth/build/reports/jacoco/test/jacocoTestReport.xml,evcs-tenant/build/reports/jacoco/test/jacocoTestReport.xml,evcs-station/build/reports/jacoco/test/jacocoTestReport.xml,evcs-order/build/reports/jacoco/test/jacocoTestReport.xml,evcs-payment/build/reports/jacoco/test/jacocoTestReport.xml,evcs-protocol/build/reports/jacoco/test/jacocoTestReport.xml,evcs-integration/build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: false

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          build/reports/
          **/build/reports/
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'evcs-mgr'
        path: '.'
        format: 'HTML'

    - name: Upload OWASP Dependency Check results
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: reports/
        retention-days: 30

  docker-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      run: |
        docker buildx build --load -t evcs-auth:latest -f evcs-auth/Dockerfile .
        docker buildx build --load -t evcs-gateway:latest -f evcs-gateway/Dockerfile .

    - name: Run Trivy on Docker images
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'evcs-auth:latest'
        format: 'sarif'
        output: 'trivy-auth-results.sarif'

    - name: Upload Trivy Docker scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-auth-results.sarif'
