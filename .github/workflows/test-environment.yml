name: Test Environment CI/CD

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_TENANT: ${{ github.repository }}-tenant
  IMAGE_NAME_STATION: ${{ github.repository }}-station

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/build/test-results/test/*.xml'

  build-and-push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for tenant service
      id: meta-tenant
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TENANT }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=test-latest,enable={{is_default_branch}}

    - name: Extract metadata for station service
      id: meta-station
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_STATION }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=test-latest,enable={{is_default_branch}}

    # 1. 先构建 common 模块（其他模块的依赖）
    - name: Build common module
      run: ./gradlew :evcs-common:build -x test --no-daemon

    # 2. 构建所有需要的 jar 包
    - name: Build service jars
      run: ./gradlew :evcs-tenant:build :evcs-station:build -x test --no-daemon

    # 3. 构建并推送 tenant 服务镜像
    - name: Build and push tenant Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./evcs-tenant/Dockerfile
        push: true
        tags: ${{ steps.meta-tenant.outputs.tags }}
        labels: ${{ steps.meta-tenant.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 4. 构建并推送 station 服务镜像
    - name: Build and push station Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./evcs-station/Dockerfile
        push: true
        tags: ${{ steps.meta-station.outputs.tags }}
        labels: ${{ steps.meta-station.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-test:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: test
      url: https://test.evcs.example.com

    steps:
    - name: Deploy to test environment
      run: |
        echo "Deploying to test environment..."
        echo "Tenant image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TENANT }}:${{ github.ref_name }}-${{ github.sha }}"
        echo "Station image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_STATION }}:${{ github.ref_name }}-${{ github.sha }}"
        # Add actual deployment commands here
