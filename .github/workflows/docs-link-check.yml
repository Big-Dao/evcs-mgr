name: Docs Link Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - "**/*.md"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "**/*.md"

jobs:
  docs-link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check non-archive markdown links
        run: python3 scripts/check_non_archive_md_links.py

      - name: Check markdown style (numbering + emoji)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          mapfile -t files < <(git diff --name-only "$base" "$head" -- '*.md' ':!docs/archive/**' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No non-archive markdown files changed; skipping style check."
            exit 0
          fi

          echo "Checking markdown style for changed files:";
          printf '%s\n' "${files[@]}"
          python3 scripts/check_markdown_style.py "${files[@]}"
