#
# Ensures Gradle can resolve the Java 21 toolchain automatically across IDEs and CI.
#
# Disable auto-download to prevent hanging in China if connection is poor. 
# Please ensure JDK 21 is installed locally if this is set to false.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
systemProp.http.socketTimeout=10000
systemProp.http.connectionTimeout=10000
