spring:
  application:
    name: evcs-protocol-test

  rabbitmq:
    enabled: false

  # Disable config server import in tests
  config:
    import: "optional:"

  # Skip Rabbit auto configuration when running tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  # H2 in-memory datasource for tests
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

logging:
  level:
    com.evcs: DEBUG
    org.springframework.amqp: ERROR
