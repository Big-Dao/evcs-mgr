spring:
  application:
    name: evcs-protocol-test

  # Disable Spring Cloud Config client in tests (avoid external dependency / long timeouts)
  cloud:
    config:
      enabled: false

  # Disable RabbitMQ in tests
  rabbitmq:
    enabled: false

  # Skip Rabbit auto configuration when running tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  # H2 in-memory datasource for tests
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JWT 测试密钥（>= 32 字符）；生产必须通过环境变量注入
jwt:
  secret: test-jwt-secret-key-for-unit-tests-0123456789

logging:
  level:
    com.evcs: DEBUG
    org.springframework.amqp: ERROR
